# ==============================================================================
# SonarQube Configuration for BookStore React Application (FER202)
# ==============================================================================

# Project Identification
sonar.projectKey=BookStore_FER202
sonar.projectName=BookStore Web Application
sonar.projectVersion=1.0.0

# Server URL (Default Local SonarQube Server)
sonar.host.url=http://localhost:9000

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Source folders to analyze
sonar.sources=src

# Exclude non-production / build files from static analysis
sonar.exclusions=node_modules/**,build/**,public/**,coverage/**,**/*.test.js,**/*.spec.js,src/reportWebVitals.js,src/setupTests.js

# Tests folder configuration (if running test coverage)
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Javascript / React environment
sonar.javascript.environments=browser,node
